[workspace]
resolver = "2"
members = ["crates/*"]
# `cargo run --release` means *the game*. Without this it became ambiguous the
# moment `cubara-server` added a second binary, which would have broken the
# documented commands and the double-click launchers (`run.command`/`run.bat`).
#
# This narrows the default scope of bare `cargo build`/`test`/`clippy` too, so
# CI passes `--workspace` explicitly rather than relying on the default -- the
# point is to choose a binary, not to stop linting a crate.
default-members = ["crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Julian Poelsma"]

# Shared dependency versions for all crates in the workspace.
[workspace.dependencies]
winit = "0.30"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
log = "0.4"
env_logger = "0.11"
puffin = "0.19"
puffin_http = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
# A data store, not a framework: a `World` is a plain value the sim owns and
# passes in (Rule 2), with no scheduler competing with the fixed-timestep loop.
# See docs/PHASE2_ARCHITECTURE.md §10.1.
hecs = "0.11"

# Optimize dependencies even in debug builds so the engine is playable while we
# still get fast incremental compiles on our own crates.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
