[package]
name = "cubara-render"
description = "Cubara — GPU renderer: pipelines, meshing upload, camera and culling."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Enable in-process CPU profiling served over puffin_http (off by default).
profile = ["dep:puffin_http"]

[dependencies]
cubara-voxel = { path = "../voxel" }
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true
image.workspace = true
# puffin scope macros compile to near-nothing unless scopes are enabled at runtime.
puffin.workspace = true
puffin_http = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests (golden images) build realistic scenes through a real
# `World` -- production code (`src/`) never touches this crate
# (`ARCHITECTURE.md` §1; `scripts/check-architecture.sh` enforces it against
# `[dependencies]` specifically, not this section).
cubara-world = { path = "../world" }
